# Opt-in production database. Apply only AFTER offline copy/validation.
# docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: mangaflow
      POSTGRES_USER: mangaflow
      POSTGRES_PASSWORD: ${MANGAFLOW_POSTGRES_PASSWORD:?Set a PostgreSQL password before enabling this file}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangaflow -d mangaflow"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  backend:
    environment:
      MANGAFLOW_DATABASE_URL: postgresql+psycopg://mangaflow@postgres:5432/mangaflow
      # libpq reads this separately, so passwords containing URL delimiters
      # remain valid and are not embedded in a connection URL/error message.
      PGPASSWORD: ${MANGAFLOW_POSTGRES_PASSWORD:?Set a PostgreSQL password before enabling this file}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
