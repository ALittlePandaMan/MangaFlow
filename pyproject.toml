[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mangaflow"
dynamic = ["version", "dependencies"]
description = "Non-destructive AI-assisted manga translation and lettering workspace"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "ALittlePandaMan"},
]
keywords = ["manga", "ocr", "translation", "inpainting", "lettering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ALittlePandaMan/MangaFlow"
Repository = "https://github.com/ALittlePandaMan/MangaFlow"
Issues = "https://github.com/ALittlePandaMan/MangaFlow/issues"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.dynamic]
version = {attr = "app.version.APP_VERSION"}
dependencies = {file = ["backend/requirements/base.txt"]}

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP017", "UP046"]
