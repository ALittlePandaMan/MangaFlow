name: Bug 报告
description: 报告可以稳定复现的问题
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。提交日志和截图前，请移除 API Key、私有接口地址和无权公开的漫画内容。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望结果是什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 运行方式
      options: [Docker Compose, 本地开发环境, 其他]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器、CPU、GPU/显存，以及 Docker、Python、Node 版本。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已确认没有包含 API Key、真实私有地址或不应公开的图片。
          required: true
        - label: 我已搜索现有 issue，未发现相同问题。
          required: true
