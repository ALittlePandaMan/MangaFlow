name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: mangaflow-release-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install packaging dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Check tag, application version and existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/release_images.py prepare --version "$RELEASE_VERSION"

  checks:
    name: Release checks
    needs: validate
    if: needs.validate.outputs.published != 'true'
    uses: ./.github/workflows/ci.yml

  images:
    name: Build ${{ matrix.service }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Reserve space for CUDA build
        if: matrix.service == 'backend'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push staged image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/alittlepandaman/mangaflow-${{ matrix.service }}:build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/ALittlePandaMan/MangaFlow
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,mode=min,scope=release-${{ matrix.service }}
      - name: Record staged digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p dist/digests
          printf '%s\n' "$IMAGE_DIGEST" > "dist/digests/$SERVICE.digest"
      - uses: actions/upload-artifact@v4
        with:
          name: release-digest-${{ matrix.service }}
          path: dist/digests/*.digest
          retention-days: 7
          overwrite: true

  release:
    name: Verify and publish
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Reserve space for CUDA runtime
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-digest-*
          path: dist/digests
          merge-multiple: true
      - name: Package public deployment files
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/package_release.py --version "$RELEASE_VERSION"
      - name: Verify anonymous pulls, startup, MCP and persistence
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python scripts/release_images.py verify --version "$RELEASE_VERSION"
          python scripts/smoke_release.py "dist/release/mangaflow-docker-$RELEASE_VERSION.zip" --digest-dir dist/digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote both images and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/release_images.py publish --version "$RELEASE_VERSION"
