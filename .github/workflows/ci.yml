name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements/dev.txt
      - name: Lint
        run: ruff check backend/app backend/tests
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Build
        run: npm run build --prefix frontend

  configuration:
    name: Configuration and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate public configuration example
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python -c "from pathlib import Path; import yaml; data=yaml.safe_load(Path('config.example.yaml').read_text()); assert data['schema_version'] == 1"
      - name: Validate Docker Compose
        run: docker compose config --quiet
