name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      MANGAFLOW_TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-isolated-only@127.0.0.1:5432/mangaflow_test_ci
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: ci-isolated-only
          POSTGRES_DB: mangaflow_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mangaflow_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements/dev.txt
      - name: Lint
        run: ruff check backend/app backend/tests scripts
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Test
        run: npm test --prefix frontend
      - name: Validate translations and visual fixtures
        run: npm run i18n:check --prefix frontend && npm run visual:typecheck --prefix frontend
      - name: Build
        run: npm run build --prefix frontend

  configuration:
    name: Configuration and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate public configuration example
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python -c "from pathlib import Path; import yaml; data=yaml.safe_load(Path('config.example.yaml').read_text()); assert data['schema_version'] == 1"
      - name: Validate application version
        run: python -c "from pathlib import Path; import json; version=Path('VERSION').read_text().strip(); assert version == json.loads(Path('frontend/package.json').read_text())['version']"
      - name: Validate Python package metadata
        run: python -m pip wheel --no-deps . --wheel-dir /tmp/mangaflow-wheel
      - name: Verify runtime wheel contents
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZipFile
          archive = next(Path('/tmp/mangaflow-wheel').glob('*.whl'))
          with ZipFile(archive) as wheel:
              names = set(wheel.namelist())
              assert not any(name.startswith('tests/') for name in names), 'Tests belong in the source tree, not the runtime wheel'
              sources = {p.relative_to('backend').as_posix() for p in Path('backend/app').rglob('*.py')}
              packaged = {name for name in names if name.startswith('app/') and name.endswith('.py')}
              assert packaged == sources, f'Runtime modules differ from source: {packaged ^ sources}'
              licenses = {p.relative_to('backend').as_posix() for p in Path('backend/app/assets/font-licenses').glob('*.txt')}
              assert licenses and licenses <= names, 'Reviewed font licenses must ship with the application'
          sys.path.insert(0, str(archive))
          from app.version import APP_VERSION
          assert APP_VERSION == Path('VERSION').read_text().strip(), 'Installed package must report its release version'
          PY
      - name: Validate PostgreSQL Docker Compose
        env:
          MANGAFLOW_POSTGRES_PASSWORD: ci-config-validation-only
        run: docker compose config --quiet
