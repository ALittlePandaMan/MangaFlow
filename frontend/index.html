<!doctype html>
<html lang="zh-CN" class="h-full overflow-hidden bg-app font-sans text-ink selection:bg-accent-soft-hover selection:text-accent-soft-ink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#212121" />
    <script>
      (() => {
        const key = 'mangaflow.theme'
        let mode = 'system'
        try {
          const stored = localStorage.getItem(key)
          if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored
        } catch {}
        const systemDark = matchMedia('(prefers-color-scheme: dark)').matches
        const resolved = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode
        document.documentElement.dataset.theme = resolved
        document.documentElement.dataset.themeMode = mode
        document.querySelector('meta[name="theme-color"]').content = resolved === 'dark' ? '#212121' : '#ffffff'
      })()
    </script>
    <title>MangaFlow</title>
  </head>
  <body class="m-0 h-full overflow-hidden text-sm leading-normal antialiased">
    <div id="root" class="h-full overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
