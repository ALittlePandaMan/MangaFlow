schema_version: 1
apply: fill-missing
preload: true

stages:
  detection:
    name: 推荐文字检测（PaddleOCR）
    provider: paddleocr
    device: recommended
    config:
      language: japan
      ocr_version: PP-OCRv5
      box_threshold: 0.45
      unclip_ratio: 1.8
      group_text_lines: false
      bubble_grouping:
        enabled: true
        confidence_threshold: 0.25
        min_bubble_confidence: 0.35
        min_containment: 0.55
        min_core_containment: 0.8
        ambiguity_margin: 0.12
        max_second_containment: 0.45
        mask_padding: 3

  inpainting:
    name: 推荐复杂修复（LaMa）
    provider: lama
    device: recommended
    config: {}

  ocr:
    name: 推荐漫画识别（MangaOCR）
    provider: manga-ocr
    device: recommended
    config:
      model: kha-white/manga-ocr-base

  rendering:
    name: 默认排版渲染（Pillow）
    provider: pillow
    config:
      min_font_size: 10

  translation:
    name: 自定义云端翻译（示例）
    provider: openai-compatible
    api_key_env: MANGAFLOW_TRANSLATION_API_KEY
    config:
      api_protocol: auto
      base_url: https://api.example.com/v1
      model: example-model
      timeout: 90
      retries: 2
      temperature: 0.2
      prompt: |-
        You are a professional manga localization translator. Translate every supplied region from the declared source language into the declared target language.

        Requirements:
        1. Preserve each character's personality, emotion, speaking style, politeness level, relationships, recurring terminology, names, honorifics, catchphrases, and continuity with the project context.
        2. Produce natural dialogue that reads like an officially localized manga, not a literal machine translation. Keep wording concise enough to fit the original speech balloon while preserving meaning and emotional impact.
        3. Handle narration, signs, captions, sound effects, and onomatopoeia appropriately for their function. Preserve meaningful Japanese honorifics when the target-language context benefits from them.
        4. Use the glossary and project context consistently. Do not add explanations, translator notes, censorship, or information absent from the source.
        5. Treat every Region ID as immutable. Never merge, split, rename, omit, reorder, or invent IDs, even when adjacent regions form one sentence.
        6. Return only one valid JSON object whose keys exactly match all supplied Region IDs and whose values are translated strings. Do not use Markdown, code fences, comments, or any text outside the JSON object.

  font:
    name: Noto Sans CJK
    provider: builtin-noto-cjk
    config:
      package: fonts-noto-cjk

# 可选：工作台快捷键。Web 设置页保存后会自动维护这部分。
preferences:
  shortcuts:
    tool.select: KeyV
    tool.rectangle: KeyR
    tool.polygon: KeyP
    tool.lasso: KeyL
    view.original: Digit1
    view.clean: Digit2
    view.translated: Digit3
    view.comparison: Digit4
    edit.undo: Mod+KeyZ
    edit.redo: Mod+KeyY
    edit.selectAll: Mod+KeyA
    zoom.out: Minus
    zoom.reset: Digit0
    zoom.in: Equal
    region.delete: Delete
    region.cancelSelection: ''
    region.merge: Mod+KeyM
    region.nudgeLeft: ArrowLeft
    region.nudgeRight: ArrowRight
    region.nudgeUp: ArrowUp
    region.nudgeDown: ArrowDown
    region.ocr: Alt+Digit1
    region.translate: Alt+Digit2
    region.inpaint: Alt+Digit3
    region.render: Alt+Digit4
    page.workflowOcr: Mod+Shift+Digit1
    page.workflowTranslate: Mod+Shift+Digit2
    page.workflowInpaint: Mod+Shift+Digit3
    page.workflowRender: Mod+Shift+Digit4
    page.import: Mod+KeyO
    page.context: Mod+Shift+KeyC
    page.export: Mod+Shift+KeyE
    page.batchOcr: Mod+Shift+KeyB
    page.reset: Mod+Shift+Backspace
